<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaGrille — démo</title>

    <!-- 1. La feuille de style du plug-in -->
    <link rel="stylesheet" href="insta-grille.css">

    <!-- Mise en page de la démo uniquement (pas nécessaire sur ton site) -->
    <style>
        body {
            margin: 0;
            padding: 40px 16px;
            background: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #262626;
        }

        .demo {
            max-width: 935px; /* largeur d'un profil Instagram sur ordinateur */
            margin: 0 auto;
        }

        .demo h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 4px;
        }

        .demo h1 a {
            color: inherit;
            text-decoration: none;
        }

        .demo p {
            margin: 0 0 24px;
            color: #737373;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="demo">
        <h1>Mes publications Instagram</h1>
        <p>Démo du plug-in InstaGrille — option B : publications lues depuis un flux JSON (Behold.so).</p>

        <!-- 2. L'emplacement de la grille -->
        <ul id="grille-instagram" aria-label="Publications Instagram"></ul>
    </main>

    <!-- 3. Le plug-in, et les publications de secours (option A) -->
    <script src="insta-grille.js"></script>
    <script src="posts.js"></script>

    <!-- 4. Le lancement -->
    <script>
        // Adresse du flux JSON. Pour le vrai compte, remplace-la par
        // l'adresse donnée par Behold (ex : 'https://feeds.behold.so/AbCdEf123')
        // — voir README.md.
        const FLUX_INSTAGRAM = 'exemple-flux.json';

        InstaGrille.monter('#grille-instagram', {
            source: FLUX_INSTAGRAM,
            // Affichées seulement si le flux ne répond pas (ou si la page est
            // ouverte en double-clic, sans serveur).
            posts: window.INSTA_POSTS
        });
    </script>
</body>
</html>
