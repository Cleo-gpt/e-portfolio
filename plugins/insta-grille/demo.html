<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaGrille — démo</title>

    <!-- 1. La feuille de style du plug-in -->
    <link rel="stylesheet" href="insta-grille.css">

    <!-- Mise en page de la démo uniquement (pas nécessaire sur ton site) -->
    <style>
        body {
            margin: 0;
            padding: 40px 16px;
            background: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #262626;
        }

        .demo {
            max-width: 935px; /* largeur d'un profil Instagram sur ordinateur */
            margin: 0 auto;
        }

        .demo h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 4px;
        }

        .demo h1 a {
            color: inherit;
            text-decoration: none;
        }

        .demo p {
            margin: 0 0 24px;
            color: #737373;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="demo">
        <h1>Mes publications Instagram</h1>
        <p>Démo du plug-in InstaGrille — option A (publications collées à la main dans posts.js).</p>

        <!-- 2. L'emplacement de la grille -->
        <ul id="grille-instagram" aria-label="Publications Instagram"></ul>
    </main>

    <!-- 3. Les publications (option A), puis le plug-in -->
    <script src="posts.js"></script>
    <script src="insta-grille.js"></script>

    <!-- 4. Le lancement -->
    <script>
        InstaGrille.monter('#grille-instagram', { posts: window.INSTA_POSTS });

        // Pour l'option B (données dynamiques), remplace la ligne du dessus par :
        // InstaGrille.monter('#grille-instagram', { source: 'https://…/posts.json' });
    </script>
</body>
</html>
