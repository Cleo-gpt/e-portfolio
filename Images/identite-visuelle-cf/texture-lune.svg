    <circle cx="60" cy="130" r="7" fill="url(#c)"/>
    <circle cx="352" cy="318" r="8" fill="url(#c)"/>
    <circle cx="176" cy="376" r="6" fill="url(#c)"/>
    <circle cx="28" cy="228" r="6" fill="url(#c)"/>
    <circle cx="300" cy="28" r="6" fill="url(#c)"/>
    <circle cx="382" cy="214" r="5" fill="url(#c)"/>
